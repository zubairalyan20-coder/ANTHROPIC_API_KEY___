<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Kestrel</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171A16">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kestrel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #171A16;
    --surface: #1F231D;
    --surface-raised: #262B22;
    --border: #33392E;
    --ink: #EDEAE0;
    --ink-dim: #9BA396;
    --amber: #D9A24B;
    --amber-dim: #6B5730;
    --sage: #8FB39A;
    --danger: #C4694B;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html, body{
    height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    max-width:520px;
    margin:0 auto;
    position:relative;
    background:
      radial-gradient(1200px 400px at 50% -10%, rgba(217,162,75,0.07), transparent 60%),
      var(--bg);
  }

  /* ---------- Header ---------- */
  header{
    flex-shrink:0;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top: max(18px, env(safe-area-inset-top));
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:30px;
    height:30px;
    border-radius:8px;
    background: linear-gradient(155deg, var(--amber), #B87F32);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .brand-mark svg{ width:16px; height:16px; }

  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:-0.01em;
  }

  .status-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--ink-dim);
  }

  .status-dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--sage);
    box-shadow: 0 0 0 3px rgba(143,179,154,0.15);
  }

  .status-dot.busy{ background: var(--amber); box-shadow: 0 0 0 3px rgba(217,162,75,0.18); }

  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color: var(--ink-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .reset-btn:hover{ border-color: var(--ink-dim); color: var(--ink); }

  .mem-btn{
    position:relative;
    background:none;
    border:1px solid var(--border);
    color: var(--ink-dim);
    width:28px; height:28px;
    border-radius:7px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .15s ease, color .15s ease;
  }
  .mem-btn:hover{ border-color: var(--ink-dim); color: var(--ink); }
  .mem-btn svg{ width:14px; height:14px; }
  .mem-badge{
    position:absolute;
    top:-5px; right:-5px;
    min-width:15px; height:15px;
    border-radius:8px;
    background: var(--sage);
    color:#12261B;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:500;
    display:flex; align-items:center; justify-content:center;
    padding:0 3px;
  }
  .mem-badge.hidden{ display:none; }

  /* ---------- Memory sheet ---------- */
  #memOverlay{
    position:absolute;
    inset:0;
    background: rgba(10,11,9,0.55);
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease;
    z-index:10;
  }
  #memOverlay.open{ opacity:1; pointer-events:auto; }

  #memSheet{
    position:absolute;
    left:0; right:0; bottom:0;
    max-width:520px;
    margin:0 auto;
    background: var(--surface);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:18px 18px 0 0;
    max-height:70%;
    display:flex;
    flex-direction:column;
    transform: translateY(100%);
    transition: transform .25s cubic-bezier(.32,.72,.35,1);
    z-index:11;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #memOverlay.open #memSheet{ transform: translateY(0); }

  .mem-handle{
    width:36px; height:4px;
    background: var(--border);
    border-radius:3px;
    margin:10px auto 4px;
  }

  .mem-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 8px 18px 12px;
    border-bottom:1px solid var(--border);
  }
  .mem-header h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:600;
  }
  .mem-forget{
    background:none;
    border:none;
    color: var(--danger);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    cursor:pointer;
  }

  .mem-list{
    overflow-y:auto;
    padding: 8px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .mem-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background: var(--surface-raised);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    line-height:1.45;
  }
  .mem-item span{ flex:1; }
  .mem-item button{
    background:none;
    border:none;
    color: var(--ink-dim);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:2px;
    flex-shrink:0;
  }
  .mem-item button:hover{ color: var(--danger); }

  .mem-empty{
    color: var(--ink-dim);
    font-size:13.5px;
    text-align:center;
    padding: 24px 20px 30px;
    line-height:1.5;
  }

  /* ---------- Log ---------- */
  #log{
    flex:1;
    overflow-y:auto;
    padding: 20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
    -webkit-overflow-scrolling: touch;
  }

  .empty-state{
    margin:auto 0;
    text-align:center;
    padding: 20px 24px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .empty-mark{
    width:52px; height:52px;
    border-radius:14px;
    background: linear-gradient(155deg, var(--amber), #B87F32);
    display:flex; align-items:center; justify-content:center;
  }
  .empty-mark svg{ width:26px; height:26px; }

  .empty-state h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  .empty-state p{
    font-size:14px;
    color: var(--ink-dim);
    line-height:1.5;
    max-width:280px;
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:4px;
  }

  .chip{
    font-size:12.5px;
    font-family:'Inter', sans-serif;
    color: var(--ink);
    background: var(--surface-raised);
    border:1px solid var(--border);
    padding:8px 13px;
    border-radius:20px;
    cursor:pointer;
    transition: border-color .15s ease, transform .1s ease;
  }
  .chip:hover{ border-color: var(--amber-dim); }
  .chip:active{ transform: scale(0.97); }

  /* ---------- Messages ---------- */
  .row{ display:flex; flex-direction:column; max-width:88%; }
  .row.user{ align-self:flex-end; align-items:flex-end; }
  .row.agent{ align-self:flex-start; align-items:flex-start; }

  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color: var(--ink-dim);
    margin-bottom:5px;
    padding:0 3px;
    letter-spacing:0.02em;
  }

  .bubble{
    padding:11px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .row.user .bubble{
    background: var(--amber);
    color: #201804;
    border-bottom-right-radius:4px;
  }

  .row.agent .bubble{
    background: var(--surface-raised);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }

  .row.agent .bubble.error{
    border-color: rgba(196,105,75,0.4);
    color: #E8B7A6;
  }

  .thinking{
    display:flex;
    gap:4px;
    padding:13px 14px;
  }
  .thinking span{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--ink-dim);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:.15s; }
  .thinking span:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{
    0%, 60%, 100%{ opacity:.3; transform:translateY(0); }
    30%{ opacity:1; transform:translateY(-2px); }
  }

  /* ---------- Ad slot ---------- */
  #adSlot{
    flex-shrink:0;
    margin: 0 14px 8px;
    border:1px solid var(--border);
    border-radius:10px;
    background: var(--surface);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  #adSlot .ad-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.04em;
    color: var(--ink-dim);
    padding: 5px 10px 0;
  }
  #adSlot .ad-body{
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
  }

  /* ---------- Composer ---------- */
  #composer{
    flex-shrink:0;
    padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .input-wrap{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding: 6px 6px 6px 15px;
    transition: border-color .15s ease;
  }
  .input-wrap:focus-within{ border-color: var(--amber-dim); }

  #textInput{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size:15px;
    line-height:1.4;
    max-height:120px;
    padding:8px 0;
  }
  #textInput::placeholder{ color: var(--ink-dim); }

  #sendBtn{
    flex-shrink:0;
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background: var(--amber);
    color:#201804;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  #sendBtn:disabled{ opacity:0.35; cursor:default; }
  #sendBtn:active:not(:disabled){ transform: scale(0.93); }
  #sendBtn svg{ width:16px; height:16px; }

  #log::-webkit-scrollbar{ width:5px; }
  #log::-webkit-scrollbar-thumb{ background: var(--border); border-radius:3px; }
</style>
</head>
<body>

<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12c0-4.4 3.6-8 8-8M20 12c0 4.4-3.6 8-8 8M8 4.5 4 8l1.8 1.8M16 19.5 20 16l-1.8-1.8" stroke="#171A16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-name">Kestrel</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="status-row"><span class="status-dot" id="statusDot"></span><span id="statusText">ready</span></div>
      <button class="mem-btn" id="memBtn" title="Memory">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 0 0-5 5c0 1.4.5 2.3 1.3 3.2.6.7 1 1.2 1 2.1V15a1 1 0 0 0 1 1h3.4a1 1 0 0 0 1-1v-1.7c0-.9.4-1.4 1-2.1.8-.9 1.3-1.8 1.3-3.2a5 5 0 0 0-5-5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19h4M10.5 21h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="mem-badge hidden" id="memBadge">0</span>
      </button>
      <button class="reset-btn" id="resetBtn">new chat</button>
    </div>
  </header>

  <div id="log">
    <div class="empty-state" id="emptyState">
      <div class="empty-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12c0-4.4 3.6-8 8-8M20 12c0 4.4-3.6 8-8 8M8 4.5 4 8l1.8 1.8M16 19.5 20 16l-1.8-1.8" stroke="#171A16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Send it to Kestrel</h1>
      <p>A pocket agent for working things out on the move. It remembers what matters across chats — tap the brain icon anytime to see or clear it.</p>
      <div class="chips">
        <div class="chip" data-prompt="Help me draft a text declining a plan without over-explaining.">Draft a text</div>
        <div class="chip" data-prompt="I have 20 minutes before a meeting — help me get ready.">Prep for a meeting</div>
        <div class="chip" data-prompt="Talk me through a decision I'm stuck on.">Think through a decision</div>
      </div>
    </div>
  </div>

  <div id="adSlot">
    <div class="ad-label">sponsored</div>
    <div class="ad-body">
      <!--
        Replace data-ad-client and data-ad-slot with the values from your
        AdSense account (Ads → By ad unit → create a Display ad, "Responsive").
      -->
      <ins class="adsbygoogle"
           style="display:block; width:100%;"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
  </div>

  <div id="composer">
    <div class="input-wrap">
      <textarea id="textInput" placeholder="Message Kestrel…" rows="1"></textarea>
      <button id="sendBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="memOverlay">
    <div id="memSheet">
      <div class="mem-handle"></div>
      <div class="mem-header">
        <h2>What Kestrel remembers</h2>
        <button class="mem-forget" id="memForgetAll">forget all</button>
      </div>
      <div class="mem-list" id="memList"></div>
    </div>
  </div>

</div>

<script>
  const log = document.getElementById('log');
  const emptyState = document.getElementById('emptyState');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const memBtn = document.getElementById('memBtn');
  const memBadge = document.getElementById('memBadge');
  const memOverlay = document.getElementById('memOverlay');
  const memList = document.getElementById('memList');
  const memForgetAll = document.getElementById('memForgetAll');

  const HISTORY_KEY = 'kestrel:history';
  const FACTS_KEY = 'kestrel:facts';

  let history = [];
  let facts = [];   // array of { id, text }
  let busy = false;
  let storageReady = false;

  function basePrompt(){
    let p = "You are Kestrel, a compact personal agent people reach for on their phone: fast questions, drafts, plans, and quick reasoning help. Default to short, direct, mobile-friendly replies — a few sentences or a tight list, not essays. Skip preamble and sign-offs. Only expand into more detail if the person's request genuinely needs it or they ask for more.";

    p += " You have persistent memory across sessions. When the person shares something durable worth remembering — a preference, a standing fact about their life, or an ongoing task/goal — end your reply with one or more lines in the exact form 'MEM:: <short fact stated plainly>' (one fact per line, no more than a handful of words each). Only do this for things worth recalling weeks from now, not one-off details. Never invent facts the person didn't state. If nothing is worth remembering, add no MEM:: lines.";

    if (facts.length){
      p += "\n\nWhat you already remember about this person:\n" + facts.map(f => "- " + f.text).join("\n");
    }
    return p;
  }

  function timeLabel(){
    const d = new Date();
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  async function loadState(){
    try {
      const h = await window.storage.get(HISTORY_KEY, false);
      if (h && h.value) history = JSON.parse(h.value);
    } catch (e) { history = []; }

    try {
      const f = await window.storage.get(FACTS_KEY, false);
      if (f && f.value) facts = JSON.parse(f.value);
    } catch (e) { facts = []; }

    storageReady = true;
    renderHistory();
    renderMemBadge();
  }

  async function saveHistory(){
    try { await window.storage.set(HISTORY_KEY, JSON.stringify(history), false); }
    catch (e) { /* best effort */ }
  }

  async function saveFacts(){
    try { await window.storage.set(FACTS_KEY, JSON.stringify(facts), false); }
    catch (e) { /* best effort */ }
  }

  function renderHistory(){
    if (!history.length) return;
    log.innerHTML = '';
    history.forEach(turn => {
      addRow(turn.role === 'user' ? 'user' : 'agent', turn.content);
    });
  }

  function renderMemBadge(){
    if (facts.length){
      memBadge.textContent = facts.length;
      memBadge.classList.remove('hidden');
    } else {
      memBadge.classList.add('hidden');
    }
  }

  function renderMemList(){
    memList.innerHTML = '';
    if (!facts.length){
      const empty = document.createElement('div');
      empty.className = 'mem-empty';
      empty.textContent = "Nothing remembered yet. Kestrel picks up durable facts and preferences as you chat.";
      memList.appendChild(empty);
      return;
    }
    facts.forEach(f => {
      const item = document.createElement('div');
      item.className = 'mem-item';

      const span = document.createElement('span');
      span.textContent = f.text;
      item.appendChild(span);

      const btn = document.createElement('button');
      btn.textContent = '✕';
      btn.title = 'Forget this';
      btn.addEventListener('click', () => {
        facts = facts.filter(x => x.id !== f.id);
        saveFacts();
        renderMemList();
        renderMemBadge();
      });
      item.appendChild(btn);

      memList.appendChild(item);
    });
  }

  function extractMemories(reply){
    const lines = reply.split('\n');
    const kept = [];
    const found = [];
    lines.forEach(line => {
      const m = line.match(/^\s*MEM::\s*(.+)$/i);
      if (m) found.push(m[1].trim());
      else kept.push(line);
    });

    found.forEach(text => {
      const norm = text.toLowerCase();
      const exists = facts.some(f => f.text.toLowerCase() === norm);
      if (!exists && text) facts.push({ id: uid(), text });
    });
    if (found.length){ saveFacts(); renderMemBadge(); }

    return kept.join('\n').trim();
  }

  memBtn.addEventListener('click', () => {
    renderMemList();
    memOverlay.classList.add('open');
  });

  memOverlay.addEventListener('click', (e) => {
    if (e.target === memOverlay) memOverlay.classList.remove('open');
  });

  memForgetAll.addEventListener('click', () => {
    facts = [];
    saveFacts();
    renderMemList();
    renderMemBadge();
  });

  function scrollToBottom(){
    log.scrollTop = log.scrollHeight;
  }

  function addRow(role, text, opts){
    opts = opts || {};
    if (emptyState.parentElement) emptyState.remove();

    const row = document.createElement('div');
    row.className = 'row ' + role;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (role === 'user' ? 'you' : 'kestrel') + ' · ' + timeLabel();
    row.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.error ? ' error' : '');
    bubble.textContent = text;
    row.appendChild(bubble);

    log.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addThinkingRow(){
    if (emptyState.parentElement) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row agent';
    row.id = 'thinkingRow';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = 'kestrel · ' + timeLabel();
    row.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = 'bubble thinking';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);

    log.appendChild(row);
    scrollToBottom();
  }

  function removeThinkingRow(){
    const row = document.getElementById('thinkingRow');
    if (row) row.remove();
  }

  function setBusy(state){
    busy = state;
    statusDot.classList.toggle('busy', state);
    statusText.textContent = state ? 'thinking' : 'ready';
    sendBtn.disabled = state || textInput.value.trim().length === 0;
    textInput.disabled = state;
  }

  async function sendMessage(text){
    history.push({ role: 'user', content: text });
    addRow('user', text);
    setBusy(true);
    addThinkingRow();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          max_tokens: 1000,
          system: basePrompt(),
          messages: history
        })
      });

      if (!response.ok) throw new Error('Request failed (' + response.status + ')');

      const data = await response.json();
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const raw = textBlocks.join('\n').trim() || "…no response came through. Try again?";
      const reply = extractMemories(raw) || "Noted.";

      removeThinkingRow();
      addRow('agent', reply);
      history.push({ role: 'assistant', content: reply });
      saveHistory();

    } catch (err) {
      removeThinkingRow();
      addRow('agent', "Couldn't reach Kestrel. Check your connection and try again.", { error: true });
      history.pop(); // drop the unanswered user turn so retry works cleanly
    } finally {
      setBusy(false);
    }
  }

  function handleSend(){
    const text = textInput.value.trim();
    if (!text || busy) return;
    textInput.value = '';
    textInput.style.height = 'auto';
    sendBtn.disabled = true;
    sendMessage(text);
  }

  sendBtn.addEventListener('click', handleSend);

  textInput.addEventListener('input', () => {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
    sendBtn.disabled = busy || textInput.value.trim().length === 0;
  });

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      textInput.value = chip.dataset.prompt;
      sendBtn.disabled = false;
      handleSend();
    });
  });

  resetBtn.addEventListener('click', () => {
    if (busy) return;
    history = [];
    saveHistory();
    log.innerHTML = '';
    log.appendChild(emptyState);
  });

  loadState();

  try {
    (window.adsbygoogle = window.adsbygoogle || []).push({});
  } catch (e) { /* ad script not yet approved/loaded — safe to ignore */ }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => { /* non-fatal */ });
    });
  }
</script>

</body>
</html>
